# Тег vX.Y.Z → релиз с module.json и module.zip (ссылки manifest/download в module.json ведут сюда)
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Версия тега = версии module.json
        run: test "v$(jq -r .version module.json)" = "$GITHUB_REF_NAME"
      - name: Тесты
        run: node --test tests/*.test.mjs
      - name: Архив
        run: zip -r module.zip module.json README.md scripts styles lang vendor
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" module.json module.zip --title "$GITHUB_REF_NAME" --generate-notes
